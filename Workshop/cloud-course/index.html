<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cloud Computing Academy — A complete interactive course from zero to intermediate level. Learn IaaS, PaaS, SaaS, AWS, Azure, Docker, Kubernetes, and more.">
  <title>Cloud Computing Academy ☁️</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" role="banner">
    <button class="menu-toggle" id="sidebarToggle" aria-label="Toggle course menu" aria-expanded="false">☰</button>
    <a href="#home" class="logo" aria-label="Cloud Computing Academy home">☁️ Cloud Computing <span>Academy</span></a>

    <nav class="main-nav" aria-label="Main navigation">
      <button class="nav-link active" data-nav="home">Home</button>
      <button class="nav-link" data-nav="course">Course</button>
      <button class="nav-link" data-nav="roadmap">Roadmap</button>
      <button class="nav-link" data-nav="labs">Labs</button>
      <button class="nav-link" data-nav="quizzes">Quizzes</button>
      <button class="nav-link" data-nav="project">Final Project</button>
      <button class="nav-link" data-nav="resources">Resources</button>
    </nav>

    <div class="header-actions">
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="Search lessons..." aria-label="Search lessons">
        <div class="search-results hidden" id="searchResults" role="listbox" aria-label="Search results"></div>
      </div>
      <div class="progress-badge" aria-label="Course progress">
        <div class="progress-mini" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-mini-fill" id="progressBar"></div>
        </div>
        <span id="progressHeader">0%</span>
      </div>
      <button class="icon-btn" id="themeToggle" aria-label="Switch to light mode">☀️</button>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Course sections">
      <div class="sidebar-progress">
        <h3>Course Progress</h3>
        <div class="progress-bar-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Overall course progress">
          <div class="progress-bar" id="progressBarSidebar"></div>
        </div>
        <p class="progress-label">Course Progress: <strong id="progressText">0%</strong></p>
      </div>
      <nav class="sidebar-nav" id="sidebarNav" aria-label="Lesson list"></nav>
    </aside>

    <div class="overlay" id="overlay" aria-hidden="true"></div>

    <main class="main-area" role="main">
      <header class="content-header">
        <h1 id="lessonTitle">Cloud Computing</h1>
        <p id="lessonSubtitle">From Your Laptop to the Cloud ☁️</p>
      </header>
      <article class="main-content" id="mainContent" aria-live="polite">
        <p>Loading course content...</p>
      </article>
    </main>
  </div>

  <script src="js/progress.js"></script>
  <script src="js/quizzes.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
